services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - metraly

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: metraly
      POSTGRES_PASSWORD: metraly
      POSTGRES_DB: metraly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metraly -d metraly"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - metraly

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgres://metraly:metraly@postgres:5432/metraly?sslmode=disable
      SEED_ON_START: "true"
      SEED_ADMIN_EMAIL: admin@metraly.local
      SEED_ADMIN_PASSWORD: admin123
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - metraly

  ui:
    build:
      context: ..
      dockerfile: app/ui/Dockerfile
      target: dev
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./ui:/workspace/ui
      - ../brandbook/packages/ui:/brandbook/packages/ui
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metraly

volumes:
  redis_data:
  postgres_data:

networks:
  metraly:
    driver: bridge
